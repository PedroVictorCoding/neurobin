<!doctype html>
<html>
<head>
  <title>My Stacks - Minimal</title>
</head>
<body>
  <h1>My Stacks</h1>
  {% for stack in stacks %}
    <div>
      <h2>{{ stack.name }}</h2>
      <ul>
        {% for item in stack.items.all %}
          <li>{{ item.compound_name }} - {{ item.dosage_amount }}</li>
        {% endfor %}
      </ul>
    </div>
  {% empty %}
    <p>No stacks yet.</p>
  {% endfor %}
</body>
</html>
