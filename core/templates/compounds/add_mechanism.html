{% extends "base.html" %}
{% block title %}Add Mechanism of Action{% endblock %}
{% block content %}
<div class="d-flex flex-column align-items-center justify-content-center" style="min-height: 70vh;">
  <div class="text-center">
    <h2 class="fw-bold mb-4" style="color:#FFF;">Add Mechanism of Action</h2>
    <form method="post" class="card bg-neurobin-card p-4 shadow" style="max-width: 400px; margin: 0 auto;">
      {% csrf_token %}
      <div class="mb-3 text-start">
        <label class="form-label text-light" for="id_name">Name{% if form.name.field.required %}*{% endif %}</label>
        {{ form.name }}
      </div>
      <div class="mb-3 text-start">
        <label class="form-label text-light" for="id_description">Description</label>
        {{ form.description }}
      </div>
      <button type="submit" class="btn btn-lg w-100" style="background:#FFF; color:#111;">Add</button>
    </form>
    <p class="mt-3"><a href="{% url 'mechanism_list' %}" class="text-info">&larr; Back to list</a></p>
  </div>
</div>
{% endblock %}
