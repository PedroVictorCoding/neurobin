{% if risk %}
  {% if risk.risk_level == "high" %}
    <span class="badge bg-danger" title="Stack risk based on ADMET-AI endpoints">Risk: High</span>
  {% elif risk.risk_level == "moderate" %}
    <span class="badge bg-warning" title="Stack risk based on ADMET-AI endpoints">Risk: Moderate</span>
  {% elif risk.risk_level == "low" %}
    <span class="badge bg-success" title="Stack risk based on ADMET-AI endpoints">Risk: Low</span>
  {% else %}
    <span class="badge bg-secondary" title="Stack risk based on ADMET-AI endpoints">Risk: Unknown</span>
  {% endif %}
{% else %}
  <span class="badge bg-secondary" title="No cached risk assessment yet">Risk: Unknown</span>
{% endif %}
