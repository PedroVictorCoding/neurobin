{% if conversion_prompt %}
  <div class="card mb-3 border-0" style="background: rgba(255,255,255,0.03);">
    <div class="card-body py-3">
      <div class="d-flex flex-column flex-lg-row gap-3 justify-content-between align-items-start align-items-lg-center">
        <div>
          <div class="fw-semibold text-white">{{ conversion_prompt.headline }}</div>
          <div class="text-muted small">{{ conversion_prompt.detail }}</div>
          <div class="small mt-2 text-muted">
            <i class="fas fa-shield-halved me-1"></i>{{ trust_microcopy.disclaimer }}
            <span class="mx-2">|</span>
            {{ trust_microcopy.integrity }}
          </div>
        </div>

        <div class="d-flex flex-wrap gap-2">
          <a class="btn btn-sm btn-info" href="{% url 'register' %}">Create Free Account</a>
          <a class="btn btn-sm btn-outline-secondary" href="{% url 'login' %}">Log In</a>
          <a class="btn btn-sm btn-outline-secondary" href="{% url 'compound_list' %}">Browse Compounds</a>
        </div>
      </div>
    </div>
  </div>
{% endif %}
