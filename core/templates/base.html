<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>{% block title %}Neurobin{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <style>
    body {
      background-color: #0d1117;
      color: #d1d5db;
      font-family: 'Segoe UI', sans-serif;
    }
    .bg-neurobin-dark { background-color: #161b22 !important; }
    .text-neurobin-accent { color: #FFF !important; }
    .bg-neurobin-card {
      background-color: #161b22 !important;
      max-width: 700px;
      width: 100%;
      border-radius: 10px;
      margin-left: auto;
      margin-right: auto;
    }
    .pill {
      background-color: #1f2937;
      color: #cbd5e1;
      padding: 0.3rem 0.8rem;
      border-radius: 999px;
      margin: 0.2rem 0.3rem 0.2rem 0;
      display: inline-block;
      font-size: 0.85rem;
    }
    /* Change placeholder color to #FFF in search bar */
    .form-control::placeholder {
      color: #fff !important;
      opacity: 1;
    }
  </style>
</head>
<body class="bg-dark text-light">

  <nav class="navbar navbar-expand-lg bg-neurobin-dark px-4 py-3">
    <div class="container-fluid">
      <a class="navbar-brand fw-bold text-light" href="/">Neurobin</a>
      <form action="{% url 'compound_search' %}" method="get" class="d-flex mx-3 flex-grow-1" style="max-width: 350px;">
        <div class="input-group input-group-sm">
          <input type="text" name="q" placeholder="Search" class="form-control bg-dark text-light border-secondary">
        </div>
      </form>
      <div class="d-flex align-items-center">
        {% if user.is_staff %}
        <div class="dropdown me-3">
          <button class="btn btn-sm btn-outline-info dropdown-toggle" style="color:#FFF; border:1px solid #FFF; background:transparent;" type="button" data-bs-toggle="dropdown" aria-expanded="false">
            Admin
          </button>
          <ul class="dropdown-menu dropdown-menu-dark">
            <li><a class="dropdown-item" href="{% url 'add_compound' %}">Add Compounds</a></li>
            <li><a class="dropdown-item" href="{% url 'add_mechanism' %}">Add Mechanisms</a></li>
            <li><a class="dropdown-item" href="{% url 'add_target' %}">Add Targets</a></li>
          </ul>
        </div>
        {% endif %}
        {% if user.is_authenticated %}
          <a href="{% url 'logout' %}" class="btn btn-link text-decoration-none" style="color:#FFF;">Logout</a>
        {% else %}
          <a href="{% url 'login' %}" class="btn btn-link text-decoration-none" style="color:#FFF;">Login</a>
        {% endif %}
      </div>
    </div>
  </nav>

  <main class="container py-5">
    {% block content %}{% endblock %}
  </main>

  <footer class="text-center text-secondary py-4 small">
    © {{ now|date:"Y" }} Neurobin
  </footer>
</body>
</html>
